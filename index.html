<html>
    <head>
        <title>Unit Converter</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="heading">
            <h1>Metric/Imperical Unit Conversion</h1>
            <input id="input-el">
            <button id="convert-btn">Convert</button>
        </div>
        <div class="secondary">
            <div id="length" class="box">
                <h2>Length (Meter/Feet)</h2>
                <p></p>
            </div>
            <div id="volume" class="box">
                <h2>Volume (Liters/Gallons)</h2>
            </div>
            <div id="mass" class="box">
                <h2>Mass (Kilograms/Pounds)</h2>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
